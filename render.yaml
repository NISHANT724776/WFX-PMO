# Render blueprint: the backend as a free Docker web service. The database is Neon (free PostgreSQL), created separately.
services:
  - type: web
    name: wfx-pmo-api
    runtime: docker
    plan: free
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL        # paste the Neon connection string in the Render dashboard
        sync: false
      - key: SECRET_KEY          # generated by Render
        generateValue: true
      - key: CORS_ORIGINS        # your Vercel address, e.g. https://wfx-pmo.vercel.app
        sync: false
      - key: ADMIN_EMAIL
        value: admin@example.com
      - key: ADMIN_PASSWORD      # choose a strong password (10+ characters) in the Render dashboard
        sync: false
